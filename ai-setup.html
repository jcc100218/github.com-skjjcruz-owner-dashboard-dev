<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';">
  <title>Dynasty HQ — Your AI</title>
  <link rel="icon" href="icon-192.png">
  <!-- Retired 2026-10-12 (owner ask): the member's own AI key lives in
       "Ask your AI" inside the app (js/shared/ask-dhq.js), also reachable
       from Settings → Your AI. This page only points old links there. -->
  <script>setTimeout(function () { window.location.replace('index.html'); }, 2500);</script>
  <style>
    :root { --bg: #0A0A0C; --card: #1B1B22; --text: #F2F2F2; --muted: #A9A9B3; --gold: #D4AF37; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #F6F4EF; --card: #FFFFFF; --text: #17171C; --muted: #5B5B66; --gold: #9A7A12; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 440px; width: 100%; background: var(--card); border: 1px solid rgba(212,175,55,.35); border-radius: var(--card-radius, 10px); padding: 24px; box-sizing: border-box; }
    h1 { margin: 0 0 8px; font-size: 1.25rem; }
    p { margin: 0 0 16px; color: var(--muted); }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: var(--card-radius-sm, 8px); background: var(--gold); color: #0A0A0C; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Your AI moved into the app</h1>
    <p>Open any league and tap the gold "Ask your AI" button, or go to Settings → Your AI, to connect your Claude, ChatGPT or Gemini key. Taking you there now…</p>
    <a href="index.html">Go to Dynasty HQ</a>
  </main>
</body>
</html>
