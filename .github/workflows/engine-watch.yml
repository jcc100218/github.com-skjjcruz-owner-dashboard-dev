# Engine watcher (engine move, step 2; owner 2026-10-13).
#
# GitHub's scheduled runs proved unreliable: the 2-hour engine build ran 5-8
# hours apart and a 15-minute schedule never fired. This job runs the passes
# itself (server/engine/watch.js): new leagues every minute, changed leagues
# every 5 minutes, a full rebuild every 2 hours. After about 5 h 45 min it
# starts the next watcher with the job's own token, so the chain needs no
# outside key. The schedule below only restarts the chain if it ever breaks;
# a watcher that finds another one already running exits at once.
#
# Free while this repo is public. Before the repos go private (engine move,
# step 6) the watcher moves to an always-on machine, since a private repo
# pays for every minute.
name: Engine watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: engine-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'skjjcruz/github.com-skjjcruz-owner-dashboard-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ENGINE_PROJECT_REF: hovnqztlbsgsywrbidbh
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exit if another watcher is already running
        id: other
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/engine-watch.yml/runs?status=in_progress" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          echo "other watchers running: $n"
          echo "busy=$([ "$n" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.other.outputs.busy == '0'
      - name: Checkout DHQ-Shared (canonical engine)
        if: steps.other.outputs.busy == '0'
        uses: actions/checkout@v6
        with:
          repository: skjjcruz/DHQ-Shared
          path: dhq-shared-src
      - uses: actions/setup-node@v6
        if: steps.other.outputs.busy == '0'
        with:
          node-version: 22
      - name: Sync shared modules from DHQ-Shared
        if: steps.other.outputs.busy == '0'
        run: DHQ_SHARED_SOURCE="$GITHUB_WORKSPACE/dhq-shared-src" node scripts/sync-reconai-shared.cjs
      - name: Watch (new leagues every minute, changed every 5, full every 2 hours)
        if: steps.other.outputs.busy == '0'
        run: node server/engine/watch.js
      - name: Start the next watcher
        if: always() && steps.other.outputs.busy == '0' && github.ref == 'refs/heads/main'
        run: |
          q=$(gh api "repos/${{ github.repository }}/actions/workflows/engine-watch.yml/runs?status=queued" --jq '.workflow_runs | length')
          if [ "$q" -gt 0 ]; then echo "a watcher is already queued"; exit 0; fi
          gh workflow run engine-watch.yml --repo "${{ github.repository }}" --ref main
          echo "next watcher started"
