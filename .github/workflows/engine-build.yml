# DHQ engine on the server (owner direction 2026-10-08).
#
# Builds every connected league with the same engine the app ships
# (server/engine/headless.js loads reconai-shared/*.js in Node) and stores the
# result in the engine project — the vacant Supabase project, separate from
# the live app's database. Runs every 2 hours in season; the owner can also
# run it by hand with a league list.
#
# Secrets: SUPABASE_ACCESS_TOKEN (the management token the function deploy
# already uses). No new secret: the script reads the engine project's own
# service key through the management API at run time.
name: Engine build

on:
  schedule:
    - cron: "17 */2 * * *"
  # Owner report 2026-10-12: Claude quoted Aaron Donald at ~1 point while the
  # app showed 3. GitHub's schedule had slipped ~6 hours, so the server was
  # still on the morning's numbers and the old projection code. A change to
  # the projection code (or the builder) now rebuilds right away.
  push:
    branches: ["main"]
    paths:
      - "js/shared/dhq-proj.js"
      - "js/shared/matchup-engine.js"
      - "js/shared/matchup-inputs.js"
      - "js/shared/dhq-baseline.js"
      - "js/shared/matchup-feeds-espn.js"
      - "js/shared/weekly-proj.js"
      - "js/shared/sleeper-proj.js"
      - "js/shared/nfl-context.js"
      - "js/utils/sos-engine.js"
      - "server/engine/**"
      - ".github/workflows/engine-build.yml"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Comma-separated Sleeper league ids (blank = every active row in connect_leagues)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: engine-build
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'skjjcruz/github.com-skjjcruz-owner-dashboard-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ENGINE_PROJECT_REF: hovnqztlbsgsywrbidbh
      LEAGUES: ${{ inputs.leagues }}
    steps:
      - uses: actions/checkout@v6
      # reconai-shared/ is gitignored: the engine files come from the canonical
      # DHQ-Shared repo at run time, exactly as the app deploy does.
      - name: Checkout DHQ-Shared (canonical engine)
        uses: actions/checkout@v6
        with:
          repository: skjjcruz/DHQ-Shared
          path: dhq-shared-src
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Sync shared modules from DHQ-Shared
        run: DHQ_SHARED_SOURCE="$GITHUB_WORKSPACE/dhq-shared-src" node scripts/sync-reconai-shared.cjs
      - name: Build and store
        run: node server/engine/run.js
