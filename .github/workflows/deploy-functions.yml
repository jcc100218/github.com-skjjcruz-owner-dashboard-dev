name: Deploy Supabase Edge Functions

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  deploy:
    # Edge functions live in the shared production Supabase project — only the
    # canonical repo deploys them. The sandbox mirror (no deploy token) skips
    # instead of failing on every push.
    if: github.repository == 'skjjcruz/github.com-skjjcruz-owner-dashboard-dev'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the deploy planner diffs against the pre-push commit.
          fetch-depth: 0

      - name: Verify Supabase deploy token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repo secret is required for Edge Function deployment." >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v2.0.0
        with:
          version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check Edge Functions
        run: |
          for fn in supabase/functions/*/index.ts; do
            deno check --node-modules-dir=auto "$fn"
          done

      # Idempotent apply of allowlisted migrations through the Management API.
      # Earlier migrations were applied by hand via the dashboard; entries
      # listed here are executed (and recorded) automatically when missing.
      # Only add migrations that are safe to re-run (if not exists / or
      # replace), because the query endpoint does not guarantee atomicity
      # across statements.
      - name: Apply pending database migrations
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os, sys

          token = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          endpoint = 'https://api.supabase.com/v1/projects/sxshiqyxhhifvtfqawbq/database/query'

          pending = {
              '20260610000000': 'supabase/migrations/20260610000000_ai_response_cache.sql',
              '20260610010000': 'supabase/migrations/20260610010000_ai_feedback.sql',
              '20260615000000': 'supabase/migrations/20260615000000_mfl_connection.sql',
              '20260710000000': 'supabase/migrations/20260710000000_dhq_pro_billing.sql',
              '20260711000000': 'supabase/migrations/20260711000000_bug_reports.sql',
              '20260711010000': 'supabase/migrations/20260711010000_feature_requests.sql',
              '20260724000000': 'supabase/migrations/20260724000000_gift_grants.sql',
              '20260730000000': 'supabase/migrations/20260730000000_analytics_case_insensitive_users.sql',
              '20260803000000': 'supabase/migrations/20260803000000_analytics_count_by_account.sql',
              '20260927000000': 'supabase/migrations/20260927000000_analytics_test_traffic_fence.sql',
              '20260918030000': 'supabase/migrations/20260918030000_account_password_change.sql',
              '20260928000000': 'supabase/migrations/20260928000000_deleted_account_tombstones.sql',
              '20261005000000': 'supabase/migrations/20261005000000_app_users_owner_club.sql',
              '20261012000000': 'supabase/migrations/20261012000000_analytics_platform_guests.sql',
          }

          def run_query(query):
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps({'query': query}).encode(),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'Accept': 'application/json',
                      'User-Agent': 'ReconAI-WarRoom-GitHub-Actions',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req) as r:
                  body = r.read().decode()
              return json.loads(body) if body else []

          quoted = ', '.join(f"'{v}'" for v in pending)
          try:
              rows = run_query(
                  f'select version from supabase_migrations.schema_migrations where version in ({quoted})'
              )
          except urllib.error.HTTPError as e:
              print('Could not read schema_migrations:', e.code, e.read().decode()[:300], file=sys.stderr)
              sys.exit(1)
          recorded = {str(row.get('version')) for row in rows if isinstance(row, dict)}

          for version in sorted(pending):
              path = pending[version]
              if version in recorded:
                  print(f'{version} already applied, skipping')
                  continue
              if not os.path.exists(path):
                  print('Migration file missing:', path, file=sys.stderr)
                  sys.exit(1)
              with open(path) as f:
                  sql = f.read()
              name = os.path.basename(path).replace('.sql', '')
              print(f'Applying {version} ({path})...')
              try:
                  run_query(sql)
                  run_query(
                      "insert into supabase_migrations.schema_migrations (version, name) "
                      f"values ('{version}', '{name}') on conflict (version) do nothing"
                  )
              except urllib.error.HTTPError as e:
                  print(f'Failed applying {version}:', e.code, e.read().decode()[:500], file=sys.stderr)
                  sys.exit(1)
              print(f'{version} applied and recorded')
          PYEOF

      - name: Verify database migrations are recorded
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os, sys
          token = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          expected = {
              '20260317000000': 'supabase/migrations/20260317000000_app_users_and_subscriptions.sql',
              '20260503000000': 'supabase/migrations/20260503000000_ai_usage_controls.sql',
              '20260503010000': 'supabase/migrations/20260503010000_tutorial_state.sql',
              '20260503020000': 'supabase/migrations/20260503020000_ai_margin_rollups.sql',
              '20260508000000': 'supabase/migrations/20260508000000_supabase_permission_hardening.sql',
              '20260610000000': 'supabase/migrations/20260610000000_ai_response_cache.sql',
              '20260610010000': 'supabase/migrations/20260610010000_ai_feedback.sql',
              '20260615000000': 'supabase/migrations/20260615000000_mfl_connection.sql',
              '20260710000000': 'supabase/migrations/20260710000000_dhq_pro_billing.sql',
              '20260711000000': 'supabase/migrations/20260711000000_bug_reports.sql',
              '20260711010000': 'supabase/migrations/20260711010000_feature_requests.sql',
              '20260724000000': 'supabase/migrations/20260724000000_gift_grants.sql',
              '20260730000000': 'supabase/migrations/20260730000000_analytics_case_insensitive_users.sql',
              '20260803000000': 'supabase/migrations/20260803000000_analytics_count_by_account.sql',
              '20260927000000': 'supabase/migrations/20260927000000_analytics_test_traffic_fence.sql',
              '20260918030000': 'supabase/migrations/20260918030000_account_password_change.sql',
              '20260928000000': 'supabase/migrations/20260928000000_deleted_account_tombstones.sql',
              '20261005000000': 'supabase/migrations/20261005000000_app_users_owner_club.sql',
              '20261012000000': 'supabase/migrations/20261012000000_analytics_platform_guests.sql',
          }

          for path in expected.values():
              if not os.path.exists(path):
                  print('Migration missing:', path, file=sys.stderr)
                  sys.exit(1)

          quoted_versions = ', '.join(f"'{version}'" for version in expected)
          query = f'select version from supabase_migrations.schema_migrations where version in ({quoted_versions})'
          req = urllib.request.Request(
              'https://api.supabase.com/v1/projects/sxshiqyxhhifvtfqawbq/database/query',
              data=json.dumps({'query': query}).encode(),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type':  'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'ReconAI-WarRoom-GitHub-Actions',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req) as r:
                  body = r.read().decode()
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print('Migration verification response:', e.code, body, file=sys.stderr)
              sys.exit(1)

          try:
              payload = json.loads(body)
          except json.JSONDecodeError:
              print('Migration verification returned non-JSON:', body[:300], file=sys.stderr)
              sys.exit(1)

          found = {str(row.get('version')) for row in payload if isinstance(row, dict)}
          missing = sorted(set(expected) - found)
          if missing:
              print('Migrations not recorded:', ', '.join(missing), file=sys.stderr)
              sys.exit(1)

          print('Recorded migrations:', ', '.join(sorted(found & set(expected))))
          PYEOF

      # ── Selective function deploys ──────────────────────────────────
      # Only functions whose source changed in this push redeploy — a push
      # touching one function no longer ripples sign-in and every other
      # endpoint through a fresh rollout (owner ruling 2026-07-27, after a
      # rollout window briefly failed live sign-ins). _shared/** or changes
      # to this workflow redeploy the full owned set, as does a manual
      # workflow_dispatch. OWNED is this repo's set only: the espn/yahoo/mfl
      # proxies deploy from ReconAI (SHARED-CODE.md "Backend Ownership");
      # report-bug / feature-requests remain hand-managed.
      - name: Plan function deploys
        id: plan
        run: |
          OWNED="nfl-depth-charts ops-board-vault ops-email-doctor admin-analytics-report admin-audit-log admin-billing-summary admin-delete-user admin-grant-pro admin-list-users admin-support-queue ai-analyze ai-feedback fw-billing-portal fw-change-password fw-confirm-password-reset fw-create-checkout fw-delete-account fw-oauth-sync fw-profile fw-refresh-session fw-request-password-reset fw-revenuecat-webhook fw-signin fw-signup fw-stripe-webhook get-session-token nfl-scoreboard set-password"
          PLAN=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — full owned set"
            PLAN="$OWNED"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No usable pre-push commit — full owned set"
              PLAN="$OWNED"
            else
              DIFF=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
              if echo "$DIFF" | grep -qE '^supabase/functions/_shared/|^\.github/workflows/deploy-functions\.yml$'; then
                echo "Shared code or this workflow changed — full owned set"
                PLAN="$OWNED"
              else
                TOUCHED=$(echo "$DIFF" | sed -n 's|^supabase/functions/\([^/]*\)/.*|\1|p' | sort -u)
                for fn in $OWNED; do
                  case " $TOUCHED " in *" $fn "*) PLAN="$PLAN $fn";; esac
                done
              fi
            fi
          fi
          PLAN=$(echo $PLAN | xargs)
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          echo "Will deploy: ${PLAN:-nothing (no owned function changed)}"

      - name: Deploy changed functions
        if: steps.plan.outputs.plan != ''
        run: |
          for fn in ${{ steps.plan.outputs.plan }}; do
            echo "── deploying $fn"
            supabase functions deploy "$fn" --project-ref sxshiqyxhhifvtfqawbq --use-api --no-verify-jwt
          done

      # NOTE: mfl-proxy is deliberately NOT deployed here. Both apps share the
      # sxshiqyxhhifvtfqawbq project, so mfl-proxy has a single owning repo —
      # ReconAI (see SHARED-CODE.md "Backend Ownership"). Deploying it from both
      # repos let the last push win and silently flip the relay's auth behavior.
