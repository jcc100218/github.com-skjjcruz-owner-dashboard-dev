name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    # The server-side engine (server/, its workflow) is not part of the app
    # page; a change there must not redeploy the app.
    paths-ignore:
      - "server/**"
      - ".github/workflows/engine-build.yml"
      - ".github/workflows/engine-deploy.yml"
      - ".github/workflows/engine-admin.yml"
  workflow_dispatch:
    inputs:
      critical:
        description: "Live update: urgent — running pages apply it at the next safe moment (any return to the app, or 60s idle) (version.json critical:true)"
        type: boolean
        default: false
      notes:
        description: "Live update: optional notes written to version.json"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # reconai-shared/ is gitignored, so the bundled browser modules must be
      # regenerated from the canonical engine (skjjcruz/DHQ-Shared) at deploy time —
      # otherwise the Pages artifact ships a stale (or missing) copy of
      # supabase-client.js and the other shared modules.
      - name: Checkout DHQ-Shared (canonical engine)
        uses: actions/checkout@v6
        with:
          repository: skjjcruz/DHQ-Shared
          path: dhq-shared-src

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Sync shared modules from DHQ-Shared
        run: DHQ_SHARED_SOURCE="$GITHUB_WORKSPACE/dhq-shared-src" DHQ_SHARED_FOR_PAGES=1 npm run sync:shared

      # Precompile every type="text/babel" entry (index.html) to plain JS
      # so production never
      # downloads ~3.1MB of @babel/standalone or runs the in-browser JSX
      # transform on cold load.
      # Also stamps the build id (<meta name="dhq-build">) into every
      # self-updating page and writes dist-deploy/version.json, which running
      # pages poll (js/shared/live-update.js) to pick up this deploy.
      - name: Precompile JSX for production (drop in-browser Babel)
        env:
          DHQ_UPDATE_CRITICAL: ${{ inputs.critical && '1' || '' }}
          DHQ_UPDATE_NOTES: ${{ inputs.notes || '' }}
        run: node scripts/build-deploy.cjs

      - name: Build Pages artifact
        run: |
          set -euo pipefail
          mkdir -p pages-artifact
          cp -R \
            index.html admin.html landing.html connect-sleeper.html upgrade.html ai-setup.html login.html reset-password.html gift.html our-vision.html \
            free-agency.html draft-warroom.html trade-calculator.html draft-war-room team-comps \
            js css content img reconai-shared icons vendor legal *.js *.json *.webmanifest *.css *.png *.ico *.svg \
            pages-artifact/ 2>/dev/null || true
          # Overlay the precompiled entries + plain-JS modules on top of the raw
          # sources, replacing the JSX files and the index.html that loaded Babel.
          cp -R dist-deploy/. pages-artifact/
          # Not published: tests and notes under js/, and modules no page
          # loads (cleanup, 2026-10-20).
          find pages-artifact/js -type f \( -name '*.test.js' -o -name '*.md' \) -delete
          rm -f pages-artifact/vendor/README.md pages-artifact/js/shared/gm-trade-engine.js pages-artifact/js/shared/qb-trade-rules-v2.js
          rm -rf pages-artifact/**/.git pages-artifact/**/node_modules pages-artifact/**/supabase pages-artifact/**/tests
          # Live update: without version.json running pages never see this deploy.
          [ -f pages-artifact/version.json ] || { echo "Missing pages-artifact/version.json" >&2; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "pages-artifact"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Prove the live site serves THIS build completely: version.json, every
      # self-updating page, and every script they boot with (200 + matching
      # content hash, per dist-deploy/version.json). Polls up to 5 min for CDN
      # propagation, then fails the run with the list of missing / stale files.
      # This repo has no CNAME, so the Pages URL comes from the deploy step.
      - name: Verify the live deploy
        run: node scripts/verify-deploy.cjs --url "${{ steps.deployment.outputs.page_url }}" --expect dist-deploy/version.json --timeout 300 --interval 15
